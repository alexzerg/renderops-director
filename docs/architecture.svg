    <rect x="660" y="315" width="195" height="108" rx="16" class="node2"/>
    <text x="685" y="350" class="h">OpenTelemetry</text><text x="685" y="378" class="p">Metrics · logs · traces</text><text x="685" y="399" class="p">Bounded shot scenario</text>
    <rect x="435" y="458" width="195" height="116" rx="16" class="node2"/>
    <text x="460" y="493" class="h">Google ADK</text><text x="460" y="521" class="p">Agent + Runner</text><text x="460" y="543" class="p">McpToolset</text>
    <rect x="660" y="458" width="195" height="116" rx="16" class="node"/>
    <text x="685" y="493" class="h">Gemini 2.5 Flash</text><text x="685" y="521" class="p">Evidence correlation</text><text x="685" y="543" class="p">Structured decision</text>
    <rect x="505" y="610" width="280" height="42" rx="21" fill="url(#purple)"/><text x="645" y="637" text-anchor="middle" class="pill">VERTEX AI · SECRET MANAGER</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="950" y="235" width="295" height="450" rx="24" class="group"/>

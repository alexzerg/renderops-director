    <rect x="980" y="315" width="235" height="75" rx="15" class="node"/><circle cx="1010" cy="352" r="9" fill="#f15b2a"/><text x="1035" y="358" class="h">Prometheus</text><text x="1035" y="379" class="small">FRAMES · GPU · COST</text>
    <rect x="980" y="410" width="235" height="75" rx="15" class="node"/><circle cx="1010" cy="447" r="9" fill="#eab308"/><text x="1035" y="453" class="h">Loki</text><text x="1035" y="474" class="small">CUDA OOM · ASSET V47</text>
    <rect x="980" y="505" width="235" height="75" rx="15" class="node"/><circle cx="1010" cy="542" r="9" fill="#8b5cf6"/><text x="1035" y="548" class="h">Tempo</text><text x="1035" y="569" class="small">DENOISER CRITICAL PATH</text>
    <rect x="980" y="610" width="235" height="42" rx="21" fill="#293044"/><text x="1097" y="637" text-anchor="middle" class="whitepill">OFFICIAL MCP · READ ONLY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1310" y="235" width="230" height="450" rx="24" class="group"/>

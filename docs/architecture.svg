  <rect x="1265" y="72" width="250" height="45" rx="22" fill="url(#orange)"/><text x="1390" y="100" text-anchor="middle" class="pill">HUMAN-APPROVED RECOVERY</text>

  <g filter="url(#shadow)">
    <rect x="70" y="235" width="270" height="450" rx="24" class="group"/>
    <text x="100" y="278" class="num">01</text><text x="140" y="278" class="h">Production input</text>
    <rect x="100" y="315" width="210" height="112" rx="16" class="node"/>
    <text x="125" y="350" class="h">Render supervisor</text>
    <text x="125" y="380" class="p">Shot SH-042</text><text x="125" y="402" class="p">Editorial deadline</text>

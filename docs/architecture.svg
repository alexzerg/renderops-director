<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b12"/><stop offset="1" stop-color="#171226"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6b35"/><stop offset="1" stop-color="#ffb547"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#57d4d4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrowO" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ff8b4c"/></marker>
    <marker id="arrowP" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8b7cf6"/></marker>
    <style>
      .title{font:800 48px Inter,Arial,sans-serif;fill:#f4f1ec;letter-spacing:-1px}.sub{font:500 19px Inter,Arial,sans-serif;fill:#9ba3b7}.eyebrow{font:700 13px Inter,Arial,sans-serif;fill:#ff7c43;letter-spacing:3px}.group{fill:#121622;stroke:#343949;stroke-width:1.5}.node{fill:#1a1f2d;stroke:#3c4253;stroke-width:1.3}.node2{fill:#201b31;stroke:#5d4f7d;stroke-width:1.3}.h{font:750 19px Inter,Arial,sans-serif;fill:#f4f1ec}.p{font:500 14px Inter,Arial,sans-serif;fill:#a6adbe}.small{font:650 12px Inter,Arial,sans-serif;fill:#858da1;letter-spacing:.5px}.pill{font:700 12px Inter,Arial,sans-serif;fill:#151019}.whitepill{font:700 12px Inter,Arial,sans-serif;fill:#e5e7ef}.lineO{stroke:#ff8b4c;stroke-width:3;fill:none;marker-end:url(#arrowO)}.lineP{stroke:#8b7cf6;stroke-width:3;fill:none;marker-end:url(#arrowP)}.dash{stroke-dasharray:8 8}.num{font:800 22px Inter,Arial,sans-serif;fill:#ff8450}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="50" r="290" fill="#663cad" opacity=".09"/><circle cx="90" cy="760" r="260" fill="#ff6b35" opacity=".06"/>

    <rect x="1340" y="315" width="170" height="85" rx="15" class="node"/><text x="1365" y="348" class="h">Diagnosis</text><text x="1365" y="376" class="p">Evidence + confidence</text>
    <rect x="1340" y="425" width="170" height="85" rx="15" class="node"/><text x="1365" y="458" class="h">Trade-offs</text><text x="1365" y="486" class="p">Cost + deadline risk</text>
    <rect x="1340" y="535" width="170" height="92" rx="15" class="node2"/><text x="1365" y="568" class="h">Recovery plan</text><text x="1365" y="596" class="p">Canary → rerender</text>
    <rect x="1340" y="645" width="170" height="30" rx="15" fill="url(#orange)"/><text x="1425" y="665" text-anchor="middle" class="pill">APPROVAL REQUIRED</text>
  </g>

  <path d="M340 450 C370 450 375 450 405 450" class="lineO"/>
  <path d="M855 370 C905 370 900 370 950 370" class="lineO"/><text x="902" y="346" text-anchor="middle" class="small">OTLP WRITE</text>
  <path d="M950 535 C915 535 920 535 885 535" class="lineP"/><text x="918" y="565" text-anchor="middle" class="small">MCP READ</text>
  <path d="M885 465 C920 465 915 465 950 465" class="lineP dash"/>
  <path d="M1245 450 C1275 450 1280 450 1310 450" class="lineO"/>

  <rect x="70" y="735" width="1470" height="92" rx="20" fill="#111521" stroke="#303646"/>
  <text x="105" y="773" class="eyebrow">TRUST BOUNDARY</text>
  <text x="105" y="804" class="p">Synthetic cinematic telemetry · live ingestion and queries</text>
  <text x="515" y="804" class="p">Approve → Canary → Grafana verify → 38-frame recovery</text>
  <text x="1035" y="804" class="p">No write tools · supervisor owns mutations</text>

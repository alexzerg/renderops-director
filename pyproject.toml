[project]
name = "renderops-director"
version = "0.6.0"
description = "Gemini production agent for cinematic render-pipeline incidents using Grafana MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aleksei Chirkunov" }]
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk>=1.15,<3",
  "google-genai>=1.30,<2",
  "mcp>=1.13,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["openspec*", "tests*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

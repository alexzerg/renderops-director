name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m compileall app
      - name: Verify required runtimes and read-only boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('app/agent.py').read_text()
          required = ['google.adk', 'McpToolset', 'StreamableHTTPConnectionParams', 'StdioConnectionParams']
          missing = [item for item in required if item not in source]
          forbidden = ['"update_dashboard"', '"create_incident"', '"add_activity_to_incident"']
          exposed = [item for item in forbidden if item in source]
          assert not missing, f'missing runtime integration: {missing}'
          assert not exposed, f'write tools exposed: {exposed}'
          print('RUNTIME_AUDIT_PASS')
          PY
      - run: docker build -t renderops-director:test .
